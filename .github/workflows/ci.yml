name: CI Build and Test

on:
  push:
    branches: [ main, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Src/Dictator.sln

      - name: Build solution
        run: dotnet build Src/Dictator.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Src/Dictator.sln --no-build --configuration Release --verbosity normal
